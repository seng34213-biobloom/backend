name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: biobloom
          POSTGRES_PASSWORD: biobloom_dev
          POSTGRES_DB: biobloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biobloom -d biobloom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://biobloom:biobloom_dev@localhost:5432/biobloom_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      SUBSCRIPTION_TOKEN_ENC_KEY: ci-only-subscription-token-key
      TZ: UTC
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILHOG_BASE_URL: http://localhost:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests with the coverage gate
        run: npm run test:cov

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Integration tests (first pass)
        run: npm run test:e2e

      - name: Integration tests (repeatability)
        run: npm run test:e2e

  audit:
    name: Dependency audit
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails on any high or critical advisory
      - name: npm audit
        run: npm audit --audit-level=high

  docker:
    name: Docker image
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only pushes to develop publish; pull requests, forks included, only build
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Render staging
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: https://biobloom-api.onrender.com/api/health
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      # Deploys the exact commit that passed CI. Render keeps the previous
      # version live if the new one fails its /api/health check.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS --max-time 30 -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null

      # The previous version keeps answering /api/health while Render builds,
      # so wait until the health check reports this commit.
      - name: Wait for staging to serve this commit
        run: |
          for _ in $(seq 1 45); do
            commit=$(curl -fsS --max-time 60 https://biobloom-api.onrender.com/api/health | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Staging is serving $GITHUB_SHA"
              exit 0
            fi
            sleep 20
          done
          echo "Staging did not serve $GITHUB_SHA within 15 minutes of the deploy" >&2
          exit 1
