name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Lint, build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: biobloom
          POSTGRES_PASSWORD: biobloom_dev
          POSTGRES_DB: biobloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biobloom -d biobloom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://biobloom:biobloom_dev@localhost:5432/biobloom_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      SUBSCRIPTION_TOKEN_ENC_KEY: ci-only-subscription-token-key
      TZ: UTC
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILHOG_BASE_URL: http://localhost:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Integration tests (first pass)
        run: npm run test:e2e

      - name: Integration tests (repeatability)
        run: npm run test:e2e

  deploy-staging:
    name: Deploy to Render staging
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: https://biobloom-api.onrender.com/api/health
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      # Deploys the exact commit that passed CI. Render keeps the previous
      # version live if the new one fails its /api/health check.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS --max-time 30 -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null

      # The previous version keeps answering /api/health while Render builds,
      # so wait until the health check reports this commit.
      - name: Wait for staging to serve this commit
        run: |
          for _ in $(seq 1 45); do
            commit=$(curl -fsS --max-time 60 https://biobloom-api.onrender.com/api/health | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Staging is serving $GITHUB_SHA"
              exit 0
            fi
            sleep 20
          done
          echo "Staging did not serve $GITHUB_SHA within 15 minutes of the deploy" >&2
          exit 1
