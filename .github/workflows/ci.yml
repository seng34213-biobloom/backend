name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Lint, build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: biobloom
          POSTGRES_PASSWORD: biobloom_dev
          POSTGRES_DB: biobloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biobloom -d biobloom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://biobloom:biobloom_dev@localhost:5432/biobloom_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-at-least-32-characters-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Integration tests
        run: npm run test:e2e
