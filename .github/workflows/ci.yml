name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Lint, build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: biobloom
          POSTGRES_PASSWORD: biobloom_dev
          POSTGRES_DB: biobloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biobloom -d biobloom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://biobloom:biobloom_dev@localhost:5432/biobloom_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      SUBSCRIPTION_TOKEN_ENC_KEY: ci-only-subscription-token-key
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILHOG_BASE_URL: http://localhost:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Integration tests
        run: npm run test:e2e

  deploy-staging:
    name: Deploy to Render staging
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://biobloom-api.onrender.com/api/health
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      # Deploys the exact commit that passed CI. Render keeps the previous
      # version live if the new one fails its /api/health check.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null

      - name: Wait for the API to respond
        run: |
          sleep 90
          for _ in $(seq 1 30); do
            if curl -fsS https://biobloom-api.onrender.com/api/health; then exit 0; fi
            sleep 20
          done
          echo "API did not respond after the deploy" >&2
          exit 1
